<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokabeln Trainer</title>
    <link rel="stylesheet" href="general.css">
    <link rel="stylesheet" href="side-bar.css">
    <link rel="stylesheet" href="skellet.css">
    <link rel="stylesheet" href="main-body.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="side-bar">
            <div class="infos">Version 1.0, Lexio™</div>
            <div class="logo-title">
                <img class="logo" src="images/logo.png">
                <h4 class="title">Lexio</h4>

            </div>
            <div class="side-bar-menu">
                <button class="button"><i class="fa-solid fa-house"></i>Übersicht</button>
                <button class="button"><i class="fa-solid fa-book"></i>Karteikarten</button>
                <button class="button"><i class="fa-solid fa-book-open"></i>Wortschatz</button>
                <button class="button"><i class="fa-solid fa-chart-bar"></i>Statistiken</button>
                <button class="button"><i class="fa-solid fa-cog"></i>Einstellung</button>
            </div>
            <div class="streak">
                <div class="streak-count">🔥18</div>
                <div class="streak-label">Tage Streak</div>
            </div>

            <div class="Profile">
                <div class="profile-data">
                    <div class="profile-pic-container">
                        <img class="profile-pic" src="images/profile_pic.png">
                    </div>
                    <div class="profile-info">
                        <h4 class="profile-name">Mustermann</h4>
                        <p class="profile-level">Level 5 • 6777 XP</p>
                    </div>
                </div>
                <div class="profile-progression-bar">
                    <div class="progression-bar">
                        <div class="progression-fill">
                            XP
                        </div>
                    </div>
                    <div class="progression-procentage">
                        65%
                    </div>


                </div>
                    

            </div>

        </div>
        <div class="main-body">
            <div class="heading-und-xp">
                <h4 class="heading-kartenhaus">Kartenhaus</h4>
                

            </div>
            

            <div class="vokabel-sets">
                <img class="add-button" src="images/tile-border-outer.svg" title="Vokabeln Hinzufügen">
                <div style="--vokabel-set-color: var(--gold);"></div>
                <div style="--vokabel-set-color: var(--terracotta);"></div>
                <div style="--vokabel-set-color: var(--sage);"></div>
                <div style="--vokabel-set-color: var(--ink);"></div>
                <div style="--vokabel-set-color: var(--paper-dim);"></div>
            </div>
            <button class="start">Los gehts ▶</button>
            <div class="stats"> 
                <div class="progress">
                    <h4 class="text-prog">Fortschritt</h4>
                    <div class="ring-rest">
                        <div class="ring" style="--progress: 65;">
                            <div class="inner">
                                <span>65%</span>
                            </div>
                        </div>
                        <div class="gelernte-karten-rest-stats">
                            <div class="vokabs-gelernt">
                                <div class="vokabeln-gelernt-div-inner">
                                    <p>Vokabeln gelernt:</p>
                                </div>
                                <div class="num-gelernt">
                                    <h6>350</h6>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
       
    </div>
</body>
</html>
