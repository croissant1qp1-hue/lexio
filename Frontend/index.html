<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vokabeln Trainer</title>

    <!-- Anfang Style Dateien -->
    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/side-bar.css">
    <link rel="stylesheet" href="styles/skellet.css">
    <link rel="stylesheet" href="styles/main-body.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Ende Style Dateien -->

    <!-- Anfang Script Links -->
    <script src="navbar/navbar.js" defer></script>
    <script src="script/add-von-karteikarten.js" defer></script>
    <!-- Ende Script Links -->

</head>

<body>

    <div class="container">

        <!-- Navbar/Sidebar wird hier geladen -->
        <div id="navbar"></div>


        <div class="main-body">

            <div class="heading-und-xp">
                <h4 class="heading-kartenhaus">Kartenhaus</h4>
            </div>


            <div class="vokabel-sets">

                <img 
                    id="add-button-id" 
                    class="add-button" 
                    src="images/tile-border-outer.svg" 
                    title="Vokabeln Hinzufügen"
                >

                <div style="--vokabel-set-color: var(--gold);"></div>
                <div style="--vokabel-set-color: var(--terracotta);"></div>
                <div style="--vokabel-set-color: var(--sage);"></div>
                <div style="--vokabel-set-color: var(--ink);"></div>
                <div style="--vokabel-set-color: var(--paper-dim);"></div>

            </div>


            <div class="stats">

                <div class="progress">

                    <h4 class="text-prog">Fortschritt</h4>

                    <div class="ring-rest">

                        <div class="ring" style="--progress: 65;">

                            <div class="inner">
                                <span>65%</span>
                            </div>

                        </div>


                        <div class="gelernte-karten-rest-stats">

                            <div class="vokabs-gelernt">

                                <div class="vokabeln-gelernt-div-inner">
                                    <p>Vokabeln gelernt:</p>
                                </div>

                                <div class="num-gelernt">
                                    <h6>350</h6>
                                </div>

                            </div>

                        </div>

                    </div>

                </div>


                <div class="Erfolge">

                </div>


            </div>


        </div>


    </div>


</body>
</html>
