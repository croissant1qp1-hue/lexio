<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--Anfang Links für styles-->
    <link rel="stylesheet" href="../styles/side-bar.css">
    <link rel="stylesheet" href="../styles/general.css">
    <!--Ende Links für styles-->
</head>
<body>
    <div class="container">
        <div class="side-bar">
            <div class="infos">Version 1.0, Lexio™</div>
            <div class="logo-title">
                <img class="logo" src="../images/logo.png">
                <h4 class="title">Lexio</h4>

            </div>
            <div class="side-bar-menu">
                <button class="button"><i class="fa-solid fa-house"></i>Übersicht</button>
                <button class="button"><i class="fa-solid fa-book"></i>Karteikarten</button>
                <button class="button"><i class="fa-solid fa-book-open"></i>Wortschatz</button>
                <button class="button"><i class="fa-solid fa-chart-bar"></i>Statistiken</button>
                <button class="button"><i class="fa-solid fa-cog"></i>Einstellung</button>
            </div>
            <div class="streak">
                <div class="streak-count">🔥18</div>
                <div class="streak-label">Tage Streak</div>
            </div>

            <div class="Profile">
                <div class="profile-data">
                    <div class="profile-pic-container">
                        <img class="profile-pic" src="../images/profile_pic.png">
                    </div>
                    <div class="profile-info">
                        <h4 class="profile-name">Mustermann</h4>
                        <p class="profile-level">Level 5 • 6777 XP</p>
                    </div>
                </div>
                <div class="profile-progression-bar">
                    <div class="progression-bar">
                        <div class="progression-fill">
                            XP
                        </div>
                    </div>
                    <div class="progression-procentage">
                        65%
                    </div>


                </div>
                    

            </div>

        </div>
        <div class="main-body">
        </div>
       
    </div>
</body>
</html>
