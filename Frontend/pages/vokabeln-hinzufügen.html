<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--Anfang Links für styles-->
    <link rel="stylesheet" href="/Frontend/styles/vokabeln-hinzufügen-seite/vokabeln-hinzufügen.css">
    <link rel="stylesheet" href="/Frontend/styles/side-bar.css">
    <link rel="stylesheet" href="/Frontend/styles/general.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!--Ende Links für styles-->

    <!--Anfang Scripts-->
    <script src="/Frontend/navbar/navbar.js" defer></script>
    <script src="/Frontend/script/vokabeln-hinzufügen/main-script-hinzufügen-seite.js" defer></script>
    <!--Ende scripts-->
</head>
<body data-active="karteikarten" >
    <div id="navbar"></div>
    <div class="main-body" id="main-body">
        <div class="seite-sprache-auswahl" id="seite-sprache-auswahl">
            <div class="überschrift-div">
                <h3 class="überschrift">Welche Sprache möchtest du lernen</h3>
            </div>
            <div class="sprachen-auswahl">
                <div class="row1">
                    <img  src="/Frontend/images/vokabel-karten-hinzufügen/sprache-auswählen/englisch.svg" class="sprache-auswählen-img" alt="englisch-card" id="englisch-button">
                    <img src="/Frontend/images/vokabel-karten-hinzufügen/sprache-auswählen/französisch.svg" class="sprache-auswählen-img" alt="franz-card" id="französisch-button">
                </div>
                <div class="row2">
                    <img src="/Frontend/images/vokabel-karten-hinzufügen/sprache-auswählen/italienisch.svg" class="sprache-auswählen-img" alt="italienisch-card" id="italienisch-button">
                    <img src="/Frontend/images/vokabel-karten-hinzufügen/sprache-auswählen/spanisch.svg" class="sprache-auswählen-img" alt="spanisch-card"id="spanisch-button">
                </div>
            </div>
        </div>
        <div class="vokabeln-hinzufügen-seite" id="vokabeln-hinzufügen-seite">
            <input type="text" class="deutsch-input" id="deutsch-input-id">
            <input type="text" class="fremd-input" id="fremd-input-id">
            <button class="hinzufügen-button">Vokabel Hinzufügen</button>
            <div class="fertig-button-div">
                <button id="fertig-button">Fertig</button>
            </div>
        </div>

    </div>
</body>
</html>
